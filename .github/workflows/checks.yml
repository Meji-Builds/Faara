name: Checks

# Runs on every push and pull request, so a broken build shows as a red mark on GitHub
# before anyone finds it in the app.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server libraries load the way Vercel loads them
        run: node scripts/check-server-libs.mjs
      - name: Typecheck (app and server)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci
