# Every push to main sends the new app code to installed preview builds (the APKs used for
# testing), so JavaScript fixes arrive without a new build. Builds only accept an update made
# from the same native code (runtimeVersion uses the fingerprint policy); anything that
# changes native code still needs a new EAS build.
name: Publish update to preview builds

on:
  push:
    branches: ['main']

jobs:
  publish_update:
    name: Publish update
    type: update
    params:
      channel: preview
